<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suscriptores &mdash; TuCosto Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --naranja:#E8521A;--naranja-d:#C94415;--naranja-light:#FFF0EB;
  --amarillo:#F5A623;--amarillo-light:#FFF8ED;
  --verde:#059669;--verde-light:#ECFDF5;
  --azul:#3B82F6;--azul-light:#EFF6FF;
  --ink:#1A1A2E;--ink-60:#6B7280;--ink-30:#D1D5DB;
  --white:#FFFFFF;--bg:#F9FAFB;
  --danger:#EF4444;--danger-light:#FEF2F2;
  --warning:#D97706;--warning-light:#FFFBEB;
  --r:12px;--shadow:0 2px 12px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;}

.top-nav{height:64px;background:var(--white);border-bottom:1px solid #F3F4F6;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.05);position:relative;z-index:10;}
.nav-left{display:flex;align-items:center;gap:14px;}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-tag{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:white;background:var(--naranja);border-radius:20px;padding:5px 12px;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-user{display:flex;align-items:center;gap:9px;font-size:.875rem;font-weight:500;color:var(--ink);}
.nav-avatar{width:34px;height:34px;background:var(--naranja);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.85rem;flex-shrink:0;}
.btn-logout{background:transparent;border:1.5px solid var(--naranja);border-radius:8px;padding:6px 14px;font-size:.82rem;font-weight:600;color:var(--naranja);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.btn-logout:hover{background:var(--naranja-light);}

.layout{display:flex;flex:1;overflow:hidden;}

.sidebar{width:220px;background:var(--white);border-right:1px solid #F3F4F6;flex-shrink:0;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;gap:2px;}
.sb-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);text-decoration:none;font-size:.875rem;font-weight:500;color:var(--ink-60);transition:all .15s;border-left:3px solid transparent;}
.sb-link:hover{background:#FFF8F5;color:var(--naranja);}
.sb-link.active{background:var(--naranja-light);color:var(--naranja);border-left-color:var(--naranja);font-weight:600;}
.sb-link svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.8;}
.sb-divider{border:none;border-top:1px solid #F3F4F6;margin:8px 0;}

.main{flex:1;overflow-y:auto;padding:28px 32px;}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.page-title{font-size:1.4rem;font-weight:700;color:var(--ink);}
.total-badge{background:var(--naranja);color:white;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:700;}

.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-30);}
.search-input{width:100%;padding:9px 12px 9px 38px;background:var(--white);border:1.5px solid var(--ink-30);border-radius:var(--r);font-family:'Inter',sans-serif;font-size:.875rem;color:var(--ink);outline:none;transition:border .2s;}
.search-input:focus{border-color:var(--naranja);}
.search-input::placeholder{color:var(--ink-30);}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{padding:8px 14px;background:var(--white);border:1.5px solid var(--ink-30);border-radius:20px;font-size:.78rem;font-weight:500;color:var(--ink-60);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.filter-btn:hover{border-color:var(--naranja);color:var(--naranja);}
.filter-btn.active{background:var(--naranja);border-color:var(--naranja);color:white;}

.table-wrap{background:var(--white);border-radius:var(--r);border:1px solid #F3F4F6;overflow:hidden;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;}
th{padding:10px 16px;text-align:left;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-60);border-bottom:1px solid #F3F4F6;background:var(--bg);}
td{padding:11px 16px;font-size:.82rem;border-bottom:1px solid #F3F4F6;vertical-align:middle;color:var(--ink);}
tr:last-child td{border-bottom:none;}
tr.clickable:hover td{background:var(--naranja-light);}
tr.selected td{background:var(--naranja-light);}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;}
.badge-activa{background:var(--verde-light);color:var(--verde);}
.badge-pend{background:var(--amarillo-light);color:var(--warning);}
.badge-venc{background:var(--danger-light);color:var(--danger);}
.badge-kyc-ok{background:var(--verde-light);color:var(--verde);}
.badge-kyc-pend{background:var(--amarillo-light);color:var(--warning);}
.badge-kyc-err{background:var(--danger-light);color:var(--danger);}

.btn-ver{padding:5px 12px;background:var(--naranja-light);border:1px solid var(--naranja);border-radius:8px;font-size:.75rem;font-weight:600;color:var(--naranja);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap;}
.btn-ver:hover{background:var(--naranja);color:white;}

.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s;}
.panel-overlay.show{opacity:1;pointer-events:all;}

.side-panel{position:fixed;top:0;right:0;bottom:0;width:460px;background:var(--white);transform:translateX(100%);transition:transform .3s;z-index:40;box-shadow:-6px 0 24px rgba(0,0,0,.1);display:flex;flex-direction:column;}
.side-panel.open{transform:translateX(0);}

.panel-header{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;background:var(--naranja);flex-shrink:0;}
.panel-title{font-size:1rem;font-weight:700;color:white;}
.btn-close-panel{background:rgba(255,255,255,.2);border:none;cursor:pointer;color:white;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.btn-close-panel:hover{background:rgba(255,255,255,.35);}

.panel-tabs{display:flex;border-bottom:2px solid #F3F4F6;background:var(--white);flex-shrink:0;}
.panel-tab{flex:1;padding:11px 4px;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;color:var(--ink-60);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.panel-tab:hover{color:var(--naranja);}
.panel-tab.active{color:var(--naranja);border-bottom-color:var(--naranja);font-weight:600;}

.panel-body{flex:1;padding:20px 24px;overflow-y:auto;}
.tab-content{display:none;}
.tab-content.active{display:block;}

.pfield{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:.82rem;border-bottom:1px solid #F9FAFB;}
.pfield:last-of-type{border-bottom:none;}
.pfield-lbl{color:var(--ink-60);}

.member-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--naranja-light);border-radius:10px;margin-bottom:6px;}
.m-av{width:32px;height:32px;background:var(--naranja);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:white;flex-shrink:0;}

.panel-actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #F3F4F6;}
.btn-activar{flex:1;padding:10px;background:var(--verde);border:none;border-radius:10px;font-size:.82rem;font-weight:600;color:white;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.btn-activar:hover{background:#047857;}
.btn-suspender{flex:1;padding:10px;background:none;border:1.5px solid var(--danger);border-radius:10px;font-size:.82rem;font-weight:600;color:var(--danger);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.btn-suspender:hover{background:var(--danger-light);}
.btn-comprobante{display:block;width:100%;margin-top:8px;padding:10px;background:var(--bg);border:1.5px solid var(--ink-30);border-radius:10px;font-size:.82rem;font-weight:600;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;text-decoration:none;text-align:center;}
.btn-comprobante:hover{background:var(--naranja-light);border-color:var(--naranja);color:var(--naranja);}

.kmo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;}
.kmo.hidden{display:none;}
.km{background:var(--white);border-radius:var(--r);width:540px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);display:flex;flex-direction:column;}
.km-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:var(--naranja);flex-shrink:0;}
.km-hd h3{font-size:1rem;font-weight:700;color:white;}
.btn-close-km{background:rgba(255,255,255,.2);border:none;cursor:pointer;color:white;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.btn-close-km:hover{background:rgba(255,255,255,.35);}
.km-body{padding:22px;}
.km-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.km-info-item{background:var(--bg);border-radius:8px;padding:10px 12px;}
.km-info-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-60);margin-bottom:2px;}
.km-info-val{font-size:.875rem;font-weight:600;color:var(--ink);}
.km-docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.km-doc{border:1px solid #F3F4F6;border-radius:10px;overflow:hidden;}
.km-doc-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-60);padding:8px 12px;background:var(--bg);border-bottom:1px solid #F3F4F6;}
.km-doc img{width:100%;height:150px;object-fit:cover;display:block;}
.km-doc-placeholder{height:150px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--bg);}
.km-motivo{display:none;margin-bottom:16px;}
.km-motivo label{font-size:.82rem;font-weight:500;color:var(--ink);display:block;margin-bottom:6px;}
.km-motivo textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ink-30);border-radius:8px;font-family:'Inter',sans-serif;font-size:.82rem;color:var(--ink);resize:vertical;min-height:80px;outline:none;}
.km-motivo textarea:focus{border-color:var(--naranja);}
.km-actions{display:flex;gap:10px;padding-top:4px;}
.km-btn-ok{flex:1;padding:11px;background:var(--verde);border:none;border-radius:10px;font-size:.875rem;font-weight:600;color:white;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s;}
.km-btn-ok:hover{background:#047857;}
.km-btn-no{flex:1;padding:11px;background:none;border:1.5px solid var(--danger);border-radius:10px;font-size:.875rem;font-weight:600;color:var(--danger);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
.km-btn-no:hover{background:var(--danger-light);}
.km-btn-confirm-no{width:100%;margin-top:8px;padding:10px;background:var(--danger);border:none;border-radius:10px;font-size:.875rem;font-weight:600;color:white;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s;}
.km-btn-confirm-no:hover{background:#dc2626;}
</style>
</head>

<script>
var _db = supabase.createClient('https://cjimcldhoglgqachcimm.supabase.co','sb_publishable_ltkndWUiaaiQaszDKnU3sA_Hl0Ty7kC');
var _todos = [], _filtro = 'todos', _selIdx = null;

(async function() {
  var sessRes = await _db.auth.getSession();
  var session = sessRes.data.session;
  if (!session) { window.location.href = '../portal/login.html'; return; }
  var user = session.user;
  var rol = null;
  if (user.user_metadata && user.user_metadata.rol) {
    rol = user.user_metadata.rol;
  } else if (user.app_metadata && user.app_metadata.rol) {
    rol = user.app_metadata.rol;
  }
  if (!rol) {
    var pRes = await _db.from('perfiles').select('rol').eq('id', user.id).single();
    rol = (pRes.data && pRes.data.rol) ? pRes.data.rol : 'suscriptor';
  }
  if (rol !== 'admin') { window.location.href = '../portal/login.html'; return; }
  document.getElementById('nav-nombre').textContent = user.email;
  document.getElementById('nav-avatar').textContent = user.email[0].toUpperCase();
  await loadSuscriptores();
})();

async function loadSuscriptores() {
  var res = await _db
    .from('usuarios')
    .select('*, suscripciones(id, estado, kyc_estado, kyc_motivo_rechazo, comprobante_url, cedula_frontal_url, cedula_posterior_url, created_at)')
    .eq('rol', 'suscriptor')
    .order('created_at', {ascending: false});
  if (res.error) {
    console.error('Error cargando suscriptores:', res.error);
    return;
  }
  _todos = res.data || [];
  document.getElementById('total-badge').textContent = _todos.length;
  renderTable();
}

function setFilter(f, btn) {
  _filtro = f;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  var q = document.getElementById('search').value.toLowerCase();
  var rows = [];
  var origIdxs = [];
  for (var i = 0; i < _todos.length; i++) {
    var s = _todos[i];
    var sSus0 = (s.suscripciones && s.suscripciones.length > 0) ? s.suscripciones[0] : null;
    if (_filtro !== 'todos' && (sSus0 ? sSus0.estado : 'pendiente') !== _filtro) continue;
    if (q) {
      var nombre = s.nombre ? s.nombre.toLowerCase() : '';
      var cedula = s.cedula ? s.cedula : '';
      var email2 = s.email ? s.email.toLowerCase() : '';
      if (!nombre.includes(q) && !cedula.includes(q) && !email2.includes(q)) continue;
    }
    rows.push(s);
    origIdxs.push(i);
  }
  var tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:28px;color:var(--ink-60)">Sin resultados</td></tr>';
    return;
  }
  var html = '';
  for (var j = 0; j < rows.length; j++) {
    var s = rows[j];
    var oidx = origIdxs[j];
    var sus0 = (s.suscripciones && s.suscripciones.length > 0) ? s.suscripciones[0] : null;
    var sEstado = sus0 ? sus0.estado : 'pendiente';
    var sKyc = sus0 ? sus0.kyc_estado : 'pendiente';
    var cls;
    if (sEstado === 'activa') cls = 'badge-activa';
    else if (sEstado === 'vencida') cls = 'badge-venc';
    else cls = 'badge-pend';
    var kycCls;
    if (sKyc === 'verificado') kycCls = 'badge-kyc-ok';
    else if (sKyc === 'rechazado') kycCls = 'badge-kyc-err';
    else kycCls = 'badge-kyc-pend';
    var kycLbl;
    if (sKyc === 'verificado') kycLbl = 'Verificado';
    else if (sKyc === 'rechazado') kycLbl = 'Rechazado';
    else kycLbl = 'Pendiente';
    var fecha = s.created_at ? new Date(s.created_at).toLocaleDateString('es-EC') : '-';
    var selClass = (_selIdx === oidx) ? ' selected' : '';
    html += '<tr class="clickable' + selClass + '">';
    html += '<td style="font-weight:600">' + (s.nombre || '-') + '</td>';
    html += '<td style="color:var(--ink-60);font-size:.78rem">' + (s.cedula || '-') + '</td>';
    html += '<td style="color:var(--ink-60);font-size:.78rem">' + (s.email || '-') + '</td>';
    html += '<td style="color:var(--ink-60)">' + (s.telefono || '-') + '</td>';
    html += '<td><span class="badge ' + cls + '">' + (sEstado || '-') + '</span></td>';
    html += '<td><span class="badge ' + kycCls + '">' + kycLbl + '</span></td>';
    html += '<td style="color:var(--ink-60)">' + fecha + '</td>';
    html += '<td><button class="btn-ver" onclick="openPanel(' + oidx + ')">Ver detalles</button></td>';
    html += '</tr>';
  }
  tbody.innerHTML = html;
}

function switchTab(name, btn) {
  var tabs = document.querySelectorAll('.tab-content');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
  var tabBtns = document.querySelectorAll('.panel-tab');
  for (var j = 0; j < tabBtns.length; j++) { tabBtns[j].classList.remove('active'); }
  document.getElementById('tab-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
}

async function openPanel(idx) {
  _selIdx = idx;
  renderTable();
  var s = _todos[idx];
  var panelName = s.nombre ? s.nombre : (s.email ? s.email : '');
  document.getElementById('panel-nombre').textContent = panelName;
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('show');

  switchTab('datos', document.querySelector('.panel-tab[data-tab="datos"]'));
  document.getElementById('tab-datos').innerHTML = '<p style="color:var(--ink-60);font-size:.875rem">Cargando...</p>';
  document.getElementById('tab-miembros').innerHTML = '';
  document.getElementById('tab-pedidos').innerHTML = '';
  document.getElementById('tab-pagos').innerHTML = '';
  document.getElementById('tab-kyc').innerHTML = '';

  var panelResults = await Promise.all([
    _db.from('miembros').select('*').eq('suscriptor_cedula', s.cedula),
    _db.from('pedidos').select('id,numero,fecha,estado,total').eq('suscriptor_cedula', s.cedula).order('fecha', {ascending: false}).limit(5),
    _db.from('pagos').select('*').eq('suscriptor_cedula', s.cedula).order('created_at', {ascending: false}).limit(5)
  ]);
  var miembros = panelResults[0].data || [];
  var pedidos = panelResults[1].data || [];
  var pagos = panelResults[2].data || [];

  // TAB DATOS
  var sus = (s.suscripciones && s.suscripciones.length > 0) ? s.suscripciones[0] : null;
  var sEstado2 = sus ? sus.estado : 'pendiente';
  var cls2;
  if (sEstado2 === 'activa') cls2 = 'badge-activa';
  else if (sEstado2 === 'vencida') cls2 = 'badge-venc';
  else cls2 = 'badge-pend';
  var cedSafe = s.cedula ? s.cedula.replace(/'/g, '') : '';
  var datosHtml = '';
  datosHtml += '<div class="pfield"><span class="pfield-lbl">Cedula</span><span style="font-weight:500">' + (s.cedula || '-') + '</span></div>';
  datosHtml += '<div class="pfield"><span class="pfield-lbl">Email</span><span style="font-weight:500">' + (s.email || '-') + '</span></div>';
  datosHtml += '<div class="pfield"><span class="pfield-lbl">Telefono</span><span style="font-weight:500">' + (s.telefono || '-') + '</span></div>';
  datosHtml += '<div class="pfield"><span class="pfield-lbl">Direccion</span><span style="font-weight:500">' + (s.direccion || '-') + '</span></div>';
  datosHtml += '<div class="pfield"><span class="pfield-lbl">Barrio</span><span style="font-weight:500">' + (s.barrio || '-') + '</span></div>';
  datosHtml += '<div class="pfield"><span class="pfield-lbl">Estado</span><span class="badge ' + cls2 + '">' + (sEstado2 || '-') + '</span></div>';
  datosHtml += '<div class="panel-actions">';
  datosHtml += '<button class="btn-activar" onclick="cambiarEstado(\'' + cedSafe + '\',\'activa\')">Activar membresia</button>';
  datosHtml += '<button class="btn-suspender" onclick="cambiarEstado(\'' + cedSafe + '\',\'vencida\')">Suspender</button>';
  datosHtml += '</div>';
  if (sus && sus.comprobante_url) {
    datosHtml += '<a href="' + sus.comprobante_url + '" target="_blank" class="btn-comprobante">Ver comprobante de pago</a>';
  }
  document.getElementById('tab-datos').innerHTML = datosHtml;

  // TAB MIEMBROS
  var membHtml = '';
  if (miembros.length) {
    for (var mi = 0; mi < miembros.length; mi++) {
      var m = miembros[mi];
      var mNombre = m.nombre ? m.nombre : '?';
      var mIni = mNombre[0].toUpperCase();
      var mRel = m.relacion ? m.relacion : 'Familiar';
      var mCed = m.cedula ? m.cedula : '';
      membHtml += '<div class="member-row">';
      membHtml += '<div class="m-av">' + mIni + '</div>';
      membHtml += '<div><p style="font-weight:600;font-size:.875rem">' + mNombre + '</p>';
      membHtml += '<p style="color:var(--ink-60);font-size:.78rem">' + mRel + ' &middot; ' + mCed + '</p></div>';
      membHtml += '</div>';
    }
  } else {
    membHtml = '<p style="color:var(--ink-60);font-size:.875rem">Sin miembros adicionales.</p>';
  }
  document.getElementById('tab-miembros').innerHTML = membHtml;

  // TAB PEDIDOS
  var pedHtml = '';
  if (pedidos.length) {
    for (var pi = 0; pi < pedidos.length; pi++) {
      var ped = pedidos[pi];
      var pc;
      if (ped.estado === 'entregado') pc = 'badge-activa';
      else if (ped.estado === 'cancelado') pc = 'badge-venc';
      else pc = 'badge-pend';
      var pedNum = ped.numero ? ped.numero : ('#' + ped.id);
      pedHtml += '<div class="pfield">';
      pedHtml += '<span style="font-size:.82rem;font-weight:500">' + pedNum + '</span>';
      pedHtml += '<span class="badge ' + pc + '">' + ped.estado + '</span>';
      pedHtml += '</div>';
    }
  } else {
    pedHtml = '<p style="color:var(--ink-60);font-size:.875rem">Sin pedidos aun.</p>';
  }
  document.getElementById('tab-pedidos').innerHTML = pedHtml;

  // TAB PAGOS
  var pagHtml = '';
  if (pagos.length) {
    for (var pgi = 0; pgi < pagos.length; pgi++) {
      var pago = pagos[pgi];
      var pgc;
      if (pago.estado === 'pagado') pgc = 'badge-activa';
      else if (pago.estado === 'rechazado') pgc = 'badge-venc';
      else pgc = 'badge-pend';
      var pagFecha = new Date(pago.created_at).toLocaleDateString('es-EC', {month: 'long', year: 'numeric'});
      pagHtml += '<div class="pfield">';
      pagHtml += '<span style="font-size:.82rem">' + pagFecha + '</span>';
      pagHtml += '<span class="badge ' + pgc + '">' + pago.estado + '</span>';
      pagHtml += '</div>';
    }
  } else {
    pagHtml = '<p style="color:var(--ink-60);font-size:.875rem">Sin pagos registrados.</p>';
  }
  document.getElementById('tab-pagos').innerHTML = pagHtml;

  // TAB KYC
  var kycEstado = sus ? sus.kyc_estado : 'pendiente';
  var kycCls2;
  if (kycEstado === 'verificado') kycCls2 = 'badge-kyc-ok';
  else if (kycEstado === 'rechazado') kycCls2 = 'badge-kyc-err';
  else kycCls2 = 'badge-kyc-pend';
  var kycLbl2;
  if (kycEstado === 'verificado') kycLbl2 = 'Verificado';
  else if (kycEstado === 'rechazado') kycLbl2 = 'Rechazado';
  else kycLbl2 = 'Pendiente';
  var kycHtml = '';
  kycHtml += '<div class="pfield"><span class="pfield-lbl">Estado KYC</span><span class="badge ' + kycCls2 + '">' + kycLbl2 + '</span></div>';
  if (kycEstado === 'rechazado' && sus && sus.kyc_motivo_rechazo) {
    kycHtml += '<div class="pfield"><span class="pfield-lbl">Motivo</span><span style="font-size:.78rem;color:var(--danger)">' + sus.kyc_motivo_rechazo + '</span></div>';
  }
  if (sus && sus.kyc_fecha) {
    kycHtml += '<div class="pfield"><span class="pfield-lbl">Fecha revision</span><span>' + new Date(sus.kyc_fecha).toLocaleDateString('es-EC') + '</span></div>';
  }
  if (sus && (sus.cedula_frontal_url || sus.cedula_posterior_url)) {
    kycHtml += '<button class="btn-comprobante" onclick="abrirModalKYC()" style="margin-top:10px">Ver documentos KYC</button>';
  } else {
    kycHtml += '<p style="font-size:.82rem;color:var(--ink-60);margin-top:6px">No hay documentos cargados.</p>';
  }
  document.getElementById('tab-kyc').innerHTML = kycHtml;
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('show');
  _selIdx = null;
  renderTable();
}

async function cambiarEstado(cedula, estado) {
  await _db.from('suscriptores').update({estado: estado}).eq('cedula', cedula);
  await loadSuscriptores();
  closePanel();
}

async function abrirModalKYC() {
  var s = _todos[_selIdx];
  var sus = (s.suscripciones && s.suscripciones.length > 0) ? s.suscripciones[0] : null;
  var kmNombre = s.nombre ? s.nombre : (s.email ? s.email : '');
  document.getElementById('km-nombre').textContent = kmNombre;
  document.getElementById('kyc-modal').classList.remove('hidden');
  var body = document.getElementById('kyc-modal-body');
  body.innerHTML = '<p style="color:var(--ink-60);font-size:.875rem">Cargando documentos...</p>';

  var frontalUrl = null, posteriorUrl = null;
  if (sus && sus.cedula_frontal_url) {
    var fRes = await _db.storage.from('kyc-documentos').createSignedUrl(sus.cedula_frontal_url, 3600);
    frontalUrl = (fRes.data && fRes.data.signedUrl) ? fRes.data.signedUrl : null;
  }
  if (sus && sus.cedula_posterior_url) {
    var bRes = await _db.storage.from('kyc-documentos').createSignedUrl(sus.cedula_posterior_url, 3600);
    posteriorUrl = (bRes.data && bRes.data.signedUrl) ? bRes.data.signedUrl : null;
  }

  var kycEstado = (sus && sus.kyc_estado) ? sus.kyc_estado : 'pendiente';
  var kycCls3;
  if (kycEstado === 'verificado') kycCls3 = 'badge-kyc-ok';
  else if (kycEstado === 'rechazado') kycCls3 = 'badge-kyc-err';
  else kycCls3 = 'badge-kyc-pend';
  var kycLbl3;
  if (kycEstado === 'verificado') kycLbl3 = 'Verificado';
  else if (kycEstado === 'rechazado') kycLbl3 = 'Rechazado';
  else kycLbl3 = 'Pendiente';

  var html = '';
  html += '<div class="km-info">';
  html += '<div class="km-info-item"><div class="km-info-lbl">Estado KYC</div><div class="km-info-val"><span class="badge ' + kycCls3 + '">' + kycLbl3 + '</span></div></div>';
  html += '</div>';
  html += '<div class="km-docs">';
  html += '<div class="km-doc"><div class="km-doc-lbl">Frontal</div>';
  if (frontalUrl) {
    html += '<img src="' + frontalUrl + '" alt="Cedula frontal"/>';
  } else {
    html += '<div class="km-doc-placeholder">&#128196;</div>';
  }
  html += '</div>';
  html += '<div class="km-doc"><div class="km-doc-lbl">Posterior</div>';
  if (posteriorUrl) {
    html += '<img src="' + posteriorUrl + '" alt="Cedula posterior"/>';
  } else {
    html += '<div class="km-doc-placeholder">&#128196;</div>';
  }
  html += '</div>';
  if (sus && sus.comprobante_url) {
    html += '<div class="km-doc"><div class="km-doc-lbl">Comprobante</div>';
    html += '<img src="' + sus.comprobante_url + '" alt="Comprobante"/>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="km-motivo" id="km-motivo">';
  html += '<label>Motivo del rechazo</label>';
  html += '<textarea id="km-motivo-text" placeholder="Indique por que se rechaza la verificacion..."></textarea>';
  html += '<button class="km-btn-confirm-no" onclick="rechazarKYC()">Confirmar rechazo</button>';
  html += '</div>';
  html += '<div class="km-actions">';
  html += '<button class="km-btn-ok" onclick="aprobarKYC()">Aprobar KYC</button>';
  html += '<button class="km-btn-no" onclick="toggleRechazarModal()">Rechazar KYC</button>';
  html += '</div>';
  body.innerHTML = html;
}

function closeKycModal() { document.getElementById('kyc-modal').classList.add('hidden'); }
function closeKycModalClick(e) { if (e.target === document.getElementById('kyc-modal')) closeKycModal(); }

function toggleRechazarModal() {
  var el = document.getElementById('km-motivo');
  if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

async function aprobarKYC() {
  var s = _todos[_selIdx];
  var susId = (s.suscripciones && s.suscripciones.length > 0) ? s.suscripciones[0].id : null;
  if (!susId) { alert('No se encontro suscripcion para este usuario.'); return; }
  await _db.from('suscripciones').update({
    kyc_estado: 'verificado',
    kyc_fecha: new Date().toISOString(),
    estado: 'activa'
  }).eq('id', susId);
  closeKycModal();
  await loadSuscriptores();
  openPanel(_selIdx);
}

async function rechazarKYC() {
  var s = _todos[_selIdx];
  var susId = (s.suscripciones && s.suscripciones.length > 0) ? s.suscripciones[0].id : null;
  if (!susId) { alert('No se encontro suscripcion para este usuario.'); return; }
  var motivo = document.getElementById('km-motivo-text').value.trim();
  if (!motivo) { document.getElementById('km-motivo-text').focus(); return; }
  await _db.from('suscripciones').update({
    kyc_estado: 'rechazado',
    kyc_fecha: new Date().toISOString(),
    kyc_motivo_rechazo: motivo
  }).eq('id', susId);
  closeKycModal();
  await loadSuscriptores();
  openPanel(_selIdx);
}

function logout() {
  _db.auth.signOut().then(function() { window.location.href = '../portal/login.html'; });
}
</script>
</body>
</html>
