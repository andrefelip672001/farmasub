<title>Restablecer contraseña — TuCosto Ecuador</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --naranja:#EF6830;--naranja-d:#C95220;--naranja-light:#FFF2EC;
  --amarillo:#F5A623;
  --ink:#1A1A2E;--ink-60:#6B7280;--ink-30:#D1D5DB;
  --white:#FFFFFF;
  --danger:#EF4444;--danger-light:#FEF2F2;
  --verde:#059669;--verde-light:#ECFDF5;
  --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#C95220 0%,#EF6830 40%,#F07040 70%,#F5A070 100%);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;top:-20%;right:-10%;
  width:520px;height:520px;
  background:radial-gradient(circle,rgba(245,166,35,.28) 0%,transparent 65%);
  pointer-events:none;
}
body::after{
  content:'';position:absolute;bottom:-15%;left:-8%;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 65%);
  pointer-events:none;
}

.card{
  background:var(--white);
  border-radius:20px;
  padding:48px 44px 36px;
  width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.20),0 4px 16px rgba(0,0,0,.10);
  position:relative;z-index:1;
}
.logo{
  display:flex;align-items:center;justify-content:center;
  gap:10px;text-decoration:none;margin-bottom:28px;
}
.card-title{
  font-size:1.65rem;font-weight:700;color:var(--ink);
  text-align:center;margin-bottom:6px;line-height:1.2;
}
.card-sub{
  text-align:center;font-size:.88rem;
  color:var(--ink-60);margin-bottom:32px;line-height:1.5;
}
.error-box{
  background:var(--danger-light);
  border:1.5px solid rgba(239,68,68,.25);
  border-radius:var(--r);
  padding:12px 14px;margin-bottom:20px;
  display:flex;align-items:flex-start;gap:10px;
}
.error-box svg{flex-shrink:0;margin-top:1px;}
.error-box p{font-size:.85rem;color:var(--danger);font-weight:500;line-height:1.4;}

.success-box{
  background:var(--verde-light);
  border:1.5px solid rgba(5,150,105,.25);
  border-radius:var(--r);
  padding:14px 16px;margin-bottom:20px;
  display:flex;align-items:flex-start;gap:10px;
}
.success-box svg{flex-shrink:0;margin-top:1px;}
.success-box p{font-size:.85rem;color:var(--verde);font-weight:500;line-height:1.5;}

.field{margin-bottom:18px;}
.field label{
  display:block;font-size:.85rem;font-weight:600;
  color:var(--ink);margin-bottom:7px;
}
.input-wrap{position:relative;}
.input-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--ink-30);pointer-events:none;
  display:flex;align-items:center;
}
.input-wrap input{
  width:100%;padding:12px 14px 12px 42px;
  border:1.5px solid var(--ink-30);border-radius:var(--r);
  font-family:'Inter',sans-serif;font-size:.93rem;
  color:var(--ink);background:var(--white);
  transition:border-color .2s,box-shadow .2s;outline:none;
}
.input-wrap input:focus{
  border-color:var(--naranja);
  box-shadow:0 0 0 3px rgba(232,82,26,.10);
}
.input-wrap input.has-toggle{padding-right:44px;}
.input-wrap input::placeholder{color:var(--ink-30);}

.pass-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--ink-30);padding:4px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;transition:color .2s;
}
.pass-toggle:hover{color:var(--naranja);}

.btn-login{
  width:100%;padding:13px;
  background:var(--naranja);color:var(--white);
  border:none;border-radius:var(--r);
  font-family:'Inter',sans-serif;font-size:.97rem;font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover:not(:disabled){
  background:var(--naranja-d);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(232,82,26,.35);
}
.btn-login:disabled{opacity:.65;cursor:not-allowed;}

.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.35);border-top-color:white;
  border-radius:50%;animation:spin .7s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.btn-login.loading .spinner{display:block;}
.btn-login.loading .btn-label{display:none;}

.back-link{text-align:center;margin-top:20px;}
.back-link a{font-size:.85rem;color:var(--naranja);text-decoration:none;font-weight:500;}
.back-link a:hover{text-decoration:underline;}

.login-footer{
  text-align:center;margin-top:20px;
  font-size:.76rem;color:rgba(255,255,255,.55);
  position:relative;z-index:1;
}

.hint{font-size:.78rem;color:var(--ink-60);margin-top:-10px;margin-bottom:18px;}

@media(max-width:480px){
  .card{padding:36px 24px 28px;}
  .card-title{font-size:1.4rem;}
}
</style>
</head>
<body>

<div class="card">

  <a href="../" class="logo">
    <div style="width:52px;height:52px;background:#EF6830;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:24px;font-weight:700;color:white;font-family:Inter,sans-serif">Tu</span></div>
    <div>
      <div style="font-size:26px;font-weight:700;color:#1A1A2E;font-family:Inter,sans-serif;line-height:1">Costo</div>
      <div style="font-size:12px;color:#EF6830;font-family:Georgia,serif;font-style:italic;line-height:1;margin-top:1px">ahorro a un Clic.</div>
    </div>
  </a>

  <h1 class="card-title">Crea tu nueva contraseña</h1>
  <p id="card-sub" class="card-sub">Verificando tu enlace...</p>

  <div id="error-box" class="error-box" style="display:none">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7" stroke="#EF4444" stroke-width="1.5"/>
      <path d="M8 5v3.5M8 10.5h.01" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p id="error-msg"></p>
  </div>

  <div id="success-box" class="success-box" style="display:none">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7" fill="#059669"/>
      <path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p>Tu contraseña se actualizó correctamente. Ya puedes iniciar sesión con la nueva.</p>
  </div>

  <form id="restablecer-form" onsubmit="handleRestablecer(event)" novalidate style="display:none">

    <div class="field">
      <label for="password">Nueva contraseña</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 9V7a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="14" r="1" fill="currentColor"/>
          </svg>
        </span>
        <input type="password" id="password" class="has-toggle" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6"/>
        <button type="button" class="pass-toggle" onclick="togglePass('password','eye-icon-1')" aria-label="Mostrar contraseña">
          <svg id="eye-icon-1" width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="password2">Confirmar contraseña</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 9V7a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="14" r="1" fill="currentColor"/>
          </svg>
        </span>
        <input type="password" id="password2" class="has-toggle" placeholder="Repite la contraseña" autocomplete="new-password" required minlength="6"/>
        <button type="button" class="pass-toggle" onclick="togglePass('password2','eye-icon-2')" aria-label="Mostrar contraseña">
          <svg id="eye-icon-2" width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" id="btn-submit" class="btn-login">
      <span class="btn-label">Guardar contraseña</span>
      <span class="spinner"></span>
    </button>

  </form>

  <div class="back-link">
    <a href="login.html">← Volver a iniciar sesión</a>
  </div>

</div>

<p class="login-footer">&#169; 2025 TuCosto Ecuador</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script>
<script>
var _db = supabase.createClient(
  'https://cjimcldhoglgqachcimm.supabase.co',
  'sb_publishable_ltkndWUiaaiQaszDKnU3sA_Hl0Ty7kC'
);

var _recoverySessionReady = false;

// El enlace del correo trae el token de recuperación en la URL.
// supabase-js lo detecta solo y dispara este evento cuando ya se puede cambiar la contraseña.
_db.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY' && session) {
    _recoverySessionReady = true;
    mostrarFormulario();
  }
});

// Si el enlace ya fue procesado antes de que este script se enganchara al evento,
// revisamos si ya hay una sesión válida.
(async function() {
  await new Promise(function(resolve) { setTimeout(resolve, 400); });
  if (_recoverySessionReady) { return; }
  var res = await _db.auth.getSession();
  if (res.data.session) {
    _recoverySessionReady = true;
    mostrarFormulario();
  } else {
    mostrarEnlaceInvalido();
  }
})();

function mostrarFormulario() {
  document.getElementById('card-sub').textContent = 'Escribe tu nueva contraseña para tu cuenta.';
  document.getElementById('restablecer-form').style.display = 'block';
}

function mostrarEnlaceInvalido() {
  document.getElementById('card-sub').textContent = 'Este enlace no es válido o ya expiró.';
  showError('Solicita un nuevo enlace desde "Olvidaste tu contraseña" en la pantalla de inicio de sesión.');
}

async function handleRestablecer(e) {
  e.preventDefault();
  clearError();

  var pass1 = document.getElementById('password').value;
  var pass2 = document.getElementById('password2').value;

  if (pass1.length < 6) {
    showError('La contraseña debe tener al menos 6 caracteres.');
    return;
  }
  if (pass1 !== pass2) {
    showError('Las contraseñas no coinciden.');
    return;
  }

  setLoading(true);
  var result = await _db.auth.updateUser({ password: pass1 });
  setLoading(false);

  if (result.error) {
    showError('No pudimos actualizar tu contraseña. Intenta de nuevo o pide un nuevo enlace.');
    return;
  }

  document.getElementById('restablecer-form').style.display = 'none';
  document.getElementById('success-box').style.display = 'flex';
  document.getElementById('card-sub').style.display = 'none';

  setTimeout(function() {
    window.location.href = 'login.html';
  }, 2500);
}

function togglePass(inputId, iconId) {
  var input = document.getElementById(inputId);
  input.type = input.type === 'password' ? 'text' : 'password';
}

function setLoading(on) {
  var btn = document.getElementById('btn-submit');
  if (on) { btn.classList.add('loading'); btn.disabled = true; }
  else { btn.classList.remove('loading'); btn.disabled = false; }
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-box').style.display = 'flex';
}

function clearError() {
  document.getElementById('error-box').style.display = 'none';
}
</script>

</body>
</html>
