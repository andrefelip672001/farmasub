<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ingresar — TuCosto Ecuador</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --naranja:#EF6830;--naranja-d:#C95220;--naranja-light:#FFF2EC;
  --amarillo:#F5A623;
  --ink:#1A1A2E;--ink-60:#6B7280;--ink-30:#D1D5DB;
  --white:#FFFFFF;
  --danger:#EF4444;--danger-light:#FEF2F2;
  --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#C95220 0%,#EF6830 40%,#F07040 70%,#F5A070 100%);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  position:relative;overflow:hidden;
}

/* Blob decorativo amarillo */
body::before{
  content:'';position:absolute;top:-20%;right:-10%;
  width:520px;height:520px;
  background:radial-gradient(circle,rgba(245,166,35,.28) 0%,transparent 65%);
  pointer-events:none;
}
body::after{
  content:'';position:absolute;bottom:-15%;left:-8%;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(255,255,255,.07) 0%,transparent 65%);
  pointer-events:none;
}

/* CARD */
.card{
  background:var(--white);
  border-radius:20px;
  padding:48px 44px 36px;
  width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.20),0 4px 16px rgba(0,0,0,.10);
  position:relative;z-index:1;
}

/* LOGO */
.logo{
  display:flex;align-items:center;justify-content:center;
  gap:10px;text-decoration:none;margin-bottom:28px;
}

/* HEADING */
.card-title{
  font-size:1.65rem;font-weight:700;color:var(--ink);
  text-align:center;margin-bottom:6px;line-height:1.2;
}
.card-sub{
  text-align:center;font-size:.88rem;
  color:var(--ink-60);margin-bottom:32px;line-height:1.5;
}

/* ERROR BOX */
.error-box{
  background:var(--danger-light);
  border:1.5px solid rgba(239,68,68,.25);
  border-radius:var(--r);
  padding:12px 14px;margin-bottom:20px;
  display:flex;align-items:flex-start;gap:10px;
}
.error-box svg{flex-shrink:0;margin-top:1px;}
.error-box p{font-size:.85rem;color:var(--danger);font-weight:500;line-height:1.4;}

/* FORM */
.field{margin-bottom:18px;}
.field label{
  display:block;font-size:.85rem;font-weight:600;
  color:var(--ink);margin-bottom:7px;
}
.input-wrap{position:relative;}
.input-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--ink-30);pointer-events:none;
  display:flex;align-items:center;
}
.input-wrap input{
  width:100%;padding:12px 14px 12px 42px;
  border:1.5px solid var(--ink-30);border-radius:var(--r);
  font-family:'Inter',sans-serif;font-size:.93rem;
  color:var(--ink);background:var(--white);
  transition:border-color .2s,box-shadow .2s;outline:none;
}
.input-wrap input:focus{
  border-color:var(--naranja);
  box-shadow:0 0 0 3px rgba(232,82,26,.10);
}
.input-wrap input.error{
  border-color:var(--danger);
  box-shadow:0 0 0 3px rgba(239,68,68,.08);
}
.input-wrap input::placeholder{color:var(--ink-30);}
.input-wrap input.has-toggle{padding-right:44px;}

/* password toggle */
.pass-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--ink-30);padding:4px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;transition:color .2s;
}
.pass-toggle:hover{color:var(--naranja);}

/* forgot */
.forgot{text-align:center;margin-top:-8px;margin-bottom:24px;}
.forgot a{
  font-size:.82rem;color:var(--naranja);
  text-decoration:none;font-weight:500;
}
.forgot a:hover{text-decoration:underline;}

/* submit */
.btn-login{
  width:100%;padding:13px;
  background:var(--naranja);color:var(--white);
  border:none;border-radius:var(--r);
  font-family:'Inter',sans-serif;font-size:.97rem;font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover:not(:disabled){
  background:var(--naranja-d);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(232,82,26,.35);
}
.btn-login:disabled{opacity:.65;cursor:not-allowed;}

/* spinner */
.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.35);border-top-color:white;
  border-radius:50%;animation:spin .7s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.btn-login.loading .spinner{display:block;}
.btn-login.loading .btn-label{display:none;}

/* divider */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:24px 0;color:var(--ink-30);font-size:.8rem;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;background:#F3F4F6;
}

/* register button */
.btn-register{
  display:block;width:100%;padding:13px;
  background:transparent;color:var(--naranja);
  border:1.5px solid var(--naranja);border-radius:var(--r);
  font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;
  text-align:center;text-decoration:none;
  transition:background .2s,box-shadow .2s;
}
.btn-register:hover{
  background:var(--naranja-light);
  box-shadow:0 2px 8px rgba(232,82,26,.15);
}

/* footer */
.login-footer{
  text-align:center;margin-top:20px;
  font-size:.76rem;color:rgba(255,255,255,.55);
  position:relative;z-index:1;
}

@media(max-width:480px){
  .card{padding:36px 24px 28px;}
  .card-title{font-size:1.4rem;}
}
</style>
</head>
<body>

<div class="card">

  <a href="../" class="logo">
    <div style="width:52px;height:52px;background:#EF6830;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:24px;font-weight:700;color:white;font-family:Inter,sans-serif">Tu</span></div>
    <div>
      <div style="font-size:26px;font-weight:700;color:#1A1A2E;font-family:Inter,sans-serif;line-height:1">Costo</div>
      <div style="font-size:12px;color:#EF6830;font-family:Georgia,serif;font-style:italic;line-height:1;margin-top:1px">ahorro a un Clic.</div>
    </div>
  </a>

  <h1 class="card-title">Bienvenido de vuelta</h1>
  <p class="card-sub">Ingresa a tu cuenta para ver tus medicamentos</p>

  <div id="error-box" class="error-box" style="display:none">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7" stroke="#EF4444" stroke-width="1.5"/>
      <path d="M8 5v3.5M8 10.5h.01" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p id="error-msg"></p>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)" novalidate>

    <div class="field">
      <label for="email">Correo electronico</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 20 16" fill="none">
            <rect x="1" y="1" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1 4l9 6 9-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required/>
      </div>
    </div>

    <div class="field">
      <label for="password">Contrasena</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 9V7a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="14" r="1" fill="currentColor"/>
          </svg>
        </span>
        <input type="password" id="password" class="has-toggle" placeholder="Tu contrasena" autocomplete="current-password" required/>
        <button type="button" class="pass-toggle" onclick="togglePass()" aria-label="Mostrar contrasena">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="forgot">
      <a href="../portal/recuperar.html">Olvidaste tu contrasena?</a>
    </div>

    <button type="submit" id="btn-submit" class="btn-login">
      <span class="btn-label">Ingresar</span>
      <span class="spinner"></span>
    </button>

  </form>

  <div class="divider">No tienes cuenta?</div>

  <a href="../registro.html" class="btn-register">Registrarse gratis</a>

</div>

<p class="login-footer">&#169; 2025 TuCosto Ecuador</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var _db = supabase.createClient(
  'https://cjimcldhoglgqachcimm.supabase.co',
  'sb_publishable_ltkndWUiaaiQaszDKnU3sA_Hl0Ty7kC'
);

// Redirigir si ya hay sesion activa
(async function() {
  var res = await _db.auth.getSession();
  if (res.data.session) { redirectByRole(res.data.session.user); }
})();

// Login
async function handleLogin(e) {
  e.preventDefault();
  clearError();

  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  if (!email || !password) {
    showError('Por favor completa todos los campos.');
    return;
  }

  setLoading(true);

  var result = await _db.auth.signInWithPassword({ email: email, password: password });

  if (result.error) {
    setLoading(false);
    showError(translateError(result.error.message));
    document.getElementById('email').classList.add('error');
    document.getElementById('password').classList.add('error');
    return;
  }

  redirectByRole(result.data.user);
}

// Rol y redireccion
async function redirectByRole(user) {
  var rol = null;
  if (user.user_metadata && user.user_metadata.rol) {
    rol = user.user_metadata.rol;
  } else if (user.app_metadata && user.app_metadata.rol) {
    rol = user.app_metadata.rol;
  }

  if (!rol) {
    var perfilRes = await _db.from('perfiles').select('rol').eq('id', user.id).single();
    rol = (perfilRes.data && perfilRes.data.rol) ? perfilRes.data.rol : 'suscriptor';
  }

  if (rol === 'admin') {
    window.location.href = '../admin/dashboard.html';
  } else {
    window.location.href = '../portal/dashboard.html';
  }
}

// Mostrar/ocultar contrasena
function togglePass() {
  var input = document.getElementById('password');
  var icon  = document.getElementById('eye-icon');
  var show  = input.type === 'password';
  input.type = show ? 'text' : 'password';
  if (show) {
    icon.innerHTML = '<path d="M3 3l14 14M8.5 8.6A3 3 0 0 0 11.4 11.5M6.1 6.2C4.2 7.5 2.7 9 2 10c1.7 2.8 4.6 5 8 5a9 9 0 0 0 3.9-.9M10 5c3.4 0 6.3 2.2 8 5a12 12 0 0 1-1.6 2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';
  } else {
    icon.innerHTML = '<path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>';
  }
}

// Helpers
function setLoading(on) {
  var btn = document.getElementById('btn-submit');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-box').style.display = 'flex';
}

function clearError() {
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('email').classList.remove('error');
  document.getElementById('password').classList.remove('error');
}

function translateError(msg) {
  if (/invalid login credentials/i.test(msg)) return 'Credenciales incorrectas. Revisa tu correo y contrasena.';
  if (/email not confirmed/i.test(msg))       return 'Por favor confirma tu correo antes de ingresar.';
  if (/too many requests/i.test(msg))         return 'Demasiados intentos, espera un momento e intenta de nuevo.';
  if (/user not found/i.test(msg))            return 'No existe una cuenta con ese correo.';
  return 'Error al iniciar sesion. Intenta nuevamente.';
}
</script>
</body>
</html>
